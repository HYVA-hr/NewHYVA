        async function sendFCMPushToEmployee(fcmToken, title, message) {
            if (!serviceAccount.project_id || !fcmToken) return;
            try {
                const header = { alg: "RS256", typ: "JWT" };
                const now = Math.floor(Date.now() / 1000);
                const claim = {
                    iss: serviceAccount.client_email,
                    scope: "https://www.googleapis.com/auth/firebase.messaging",
                    aud: "https://oauth2.googleapis.com/token",
                    exp: now + 3600,
                    iat: now
                };
                
                const jwt = KJUR.jws.JWS.sign("RS256", JSON.stringify(header), JSON.stringify(claim), serviceAccount.private_key);
                
                const tokenResponse = await fetch("https://oauth2.googleapis.com/token", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: `grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion=${jwt}`
                });
                
                const tokenData = await tokenResponse.json();
                const accessToken = tokenData.access_token;

                await fetch(`https://fcm.googleapis.com/v1/projects/${serviceAccount.project_id}/messages:send`, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${accessToken}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: {
                            token: fcmToken,
                            notification: {
                                title: title,
                                body: message
                            },
                            android: {
                                notification: {
                                    channel_id: "shift_alarms_v3",
                                    sound: "notification"
                                }
                            }
                        }
                    })
                });
            } catch(e) {
                console.error("FCM Push Error:", e);
            }
        }

        // DUMMY WHATSAPP API FUNCTION (Kept 100% Intact as requested)

        async function fetchLeaves() {
            const pendingList = document.getElementById('pendingLeavesList');
            const historyList = document.getElementById('historyLeavesList');
            
            try {
                const querySnapshot = await getDocs(collection(db, "leaves"));
                let allLeaves = [];
                
                for (const leaveDoc of querySnapshot.docs) {
                    const leave = leaveDoc.data();
                    leave.id = leaveDoc.id;
                    
                    let empName = "Unknown Employee";
                    let empPhone = "No Phone";
                    try {
                        const empSnap = await getDoc(doc(db, "employees", leave.uid));
                        if(empSnap.exists()) {
                            const empData = empSnap.data();
                            empName = empData.name || empData.email || "Name not registered";
                            empPhone = empData.phone || "No Phone";
                        }
                    } catch(e) {}
                    
                    leave.empName = empName;
                    leave.empPhone = empPhone;
                    allLeaves.push(leave);
                }
                
                allLeaves.sort((a, b) => (b.appliedAt || 0) - (a.appliedAt || 0));
                
                const pending = allLeaves.filter(l => l.status === 'PENDING');
                const history = allLeaves.filter(l => l.status === 'APPROVED' || l.status === 'REJECTED');
                
                // PENDING
                if (pending.length === 0) pendingList.innerHTML = "<p style='color: #aaa;'>No pending leave requests.</p>";
                else {
                    pendingList.innerHTML = "";
                    pending.forEach(leave => {

                        card.className = "leave-card";

                            <p><strong>Duration:</strong> ${leave.fromDate} to ${leave.toDate} (${leave.totalDays} Days)</p>
                            <p><strong>Reason:</strong> ${leave.reason}</p>
                            <div class="action-btns">
                                <button class="btn-approve" onclick="updateLeaveStatus('${leave.id}', 'APPROVED', '${leave.empPhone}', '${leave.empName}', '${leave.uid}')">Approve</button>
                                <button class="btn-reject" onclick="updateLeaveStatus('${leave.id}', 'REJECTED', '${leave.empPhone}', '${leave.empName}', '${leave.uid}')">Reject</button>
                            </div>
                        `;
                        pendingList.appendChild(card);
                    });
                }

                // HISTORY
                if (history.length === 0) historyList.innerHTML = "<p style='color: #aaa;'>No leave history found.</p>";
                else {
                    historyList.innerHTML = "";
                    history.forEach(leave => {
                        const isApproved = leave.status === 'APPROVED';
                        const badgeColor = isApproved ? '#2ecc71' : '#e74c3c';
                        const card = document.createElement('div');
                        card.className = "leave-card";
                        card.style.borderLeftColor = badgeColor;
                        card.innerHTML = `
                            <div class="status-badge" style="color: ${badgeColor};">${leave.status}</div>
                            <h3 style="margin-right: 70px;">${leave.empName}</h3>
                            <p><strong>Duration:</strong> ${leave.fromDate} to ${leave.toDate} (${leave.totalDays} Days)</p>
                            <p><strong>Reason:</strong> ${leave.reason}</p>
                        `;
                        historyList.appendChild(card);
                    });
                }
            } catch (error) {
                pendingList.innerHTML = "<p style='color: #e74c3c;'>Error: " + error.message + "</p>";
            }
        }

        window.updateLeaveStatus = async function(leaveId, newStatus, phone, name, uid) {
            const confirmMsg = newStatus === 'APPROVED' ? "Approve leave and send notifications?" : "Reject leave and send notifications?";
            if (!confirm(confirmMsg)) return;

            try {
                // Update Leave Status in Database
                await updateDoc(doc(db, "leaves", leaveId), {
                    status: newStatus,
                    actionTakenAt: Date.now()
                });
                
                // Formulate Notification Message
                const msg = `Hi ${name}, your leave request has been ${newStatus}.`;

                // 1. Trigger Dummy WhatsApp Call (Future API)
                sendDummyWhatsApp(phone, msg);

                // 2. FIRE NATIVE FCM PUSH TO EMPLOYEE (Universal)
                if (uid) {
                    const empSnap = await getDoc(doc(db, "employees", uid));
                    if (empSnap.exists() && empSnap.data().fcmToken) {
                        const fcmToken = empSnap.data().fcmToken;
                        await sendFCMPushToEmployee(fcmToken, `Leave ${newStatus}`, msg);
                    }
                }

                // Refresh the list visually
                fetchLeaves(); 

            } catch (error) {
                alert("Error updating leave: " + error.message);
            }
        };
