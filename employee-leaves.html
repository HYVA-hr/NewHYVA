    <div class="container">
        <!-- Apply Leave Card -->
        <div class="card">
            <h2>Apply for Leave</h2>
            <form id="leaveForm">
                <div class="input-group">
                    <label>Leave Type</label>
                    <select id="leaveType" required>
                        <option value="Casual Leave (CL)">Casual Leave (CL)</option>
                        <option value="Sick Leave (SL)">Sick Leave (SL)</option>
                        <option value="Paid Leave (PL)">Paid Leave (PL)</option>
                    </select>
                </div>
                
                <div class="date-grid">
                    <div class="input-group">
                        <label>From Date</label>
                        <input type="date" id="fromDate" required>
                    </div>
                    <div class="input-group">
                        <label>To Date</label>
                        <input type="date" id="toDate" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Reason for Leave</label>
                    <textarea id="reason" rows="2" required placeholder="Enter reason..."></textarea>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">Submit Application</button>
                <div id="statusMsg"></div>
            </form>
        </div>

        <!-- Leave History -->
        <div class="card" style="border-top-color: #2ecc71;">
            <h2 style="color: #2ecc71;">My Leave History</h2>
            <div id="leaveHistoryList"><p style="color: #aaa; text-align: center;">Loading history...</p></div>
        </div>

        async function sendFCMPushToAdmin(title, message) {
            if (!serviceAccount.project_id) {
                console.warn("Service Account JSON not pasted. Skipped waking up Admin phone.");
                return;
            }

            try {
                // Fetch Admin's FCM Token from Firestore
                const adminDoc = await getDoc(doc(db, "settings", "admin_data"));
                if (!adminDoc.exists() || !adminDoc.data().fcmToken) {
                    console.log("Admin FCM token not found in database.");
                    return;
                }
                const adminToken = adminDoc.data().fcmToken;

                const header = { alg: "RS256", typ: "JWT" };
                const now = Math.floor(Date.now() / 1000);
                const claim = {
                    iss: serviceAccount.client_email,
                    scope: "https://www.googleapis.com/auth/firebase.messaging",
                    aud: "https://oauth2.googleapis.com/token",
                    exp: now + 3600,
                    iat: now
                };
                
                const jwt = KJUR.jws.JWS.sign("RS256", JSON.stringify(header), JSON.stringify(claim), serviceAccount.private_key);
                
                const tokenResponse = await fetch("https://oauth2.googleapis.com/token", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: `grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion=${jwt}`
                });
                
                const tokenData = await tokenResponse.json();
                const accessToken = tokenData.access_token;

                await fetch(`https://fcm.googleapis.com/v1/projects/${serviceAccount.project_id}/messages:send`, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${accessToken}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: {
                            token: adminToken,
                            notification: {
                                title: title,
                                body: message
                            },
                            android: {
                                notification: {
                                    channel_id: "admin_alerts",
                                    sound: "notification"
                                }
                            }
                        }
                    })
                });
            } catch(e) {
                console.error("FCM Push Error:", e);
            }
        }
        // =========================================================================

        // Service Worker Registration for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log("Service Worker Registered Successfully"))
                .catch((err) => console.log("Service Worker Registration Failed", err));
        }

        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = "index.html";
            else {
                currentUser = user;
                fetchLeaves(user.uid);
            }
        });

        document.getElementById('leaveForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusMsg = document.getElementById('statusMsg');
            const submitBtn = document.getElementById('submitBtn');
            
            submitBtn.disabled = true;
            statusMsg.innerText = "Submitting...";
            statusMsg.style.color = "#f39c12";

            const fromDate = document.getElementById('fromDate').value;
            const toDate = document.getElementById('toDate').value;
            const leaveType = document.getElementById('leaveType').value;

            // Calculate total days
            const d1 = new Date(fromDate);
            const d2 = new Date(toDate);
            const diffTime = Math.abs(d2 - d1);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;

            if (d2 < d1) {
                alert("To Date cannot be earlier than From Date!");
                submitBtn.disabled = false;
                statusMsg.innerText = "";
                return;
            }

            const leaveData = {
                uid: currentUser.uid,
                leaveType: leaveType,
                fromDate: fromDate,
                toDate: toDate,
                totalDays: diffDays,
                reason: document.getElementById('reason').value,
                status: "PENDING",
                appliedAt: Date.now()
            };

            try {
                await addDoc(collection(db, "leaves"), leaveData);
                statusMsg.innerText = "Leave Application Submitted!";
                statusMsg.style.color = "#2ecc71";
                document.getElementById('leaveForm').reset();
                fetchLeaves(currentUser.uid);

                // FIRE NATIVE FCM PUSH TO ADMIN
                // Ensure employee data is loaded correctly (fallback to Generic if not fully loaded)
                let empName = "An Employee";
                try {
                    let d = JSON.parse(localStorage.getItem('currentUserData'));
                    if (d && d.name) empName = d.name;
                    else if (window.currentUserData && window.currentUserData.name) empName = window.currentUserData.name;
                } catch(e) {}
                
                await sendFCMPushToAdmin("Leave Request Pending", `${empName} applied for ${diffDays} days of ${leaveType}.`);

            } catch (error) {
                statusMsg.innerText = "Error: " + error.message;
                statusMsg.style.color = "#e74c3c";
            } finally {
                submitBtn.disabled = false;
                setTimeout(() => statusMsg.innerText = "", 3000);
            }
        });

        async function fetchLeaves(uid) {
            const listDiv = document.getElementById('leaveHistoryList');
            try {
                const q = query(collection(db, "leaves"), where("uid", "==", uid));
                const snap = await getDocs(q);
                
                let leaves = [];
                snap.forEach(doc => leaves.push({ id: doc.id, ...doc.data() }));
                leaves.sort((a, b) => b.appliedAt - a.appliedAt);

                if (leaves.length === 0) {
                    listDiv.innerHTML = "<p style='color: #aaa; text-align: center;'>No leave applications found.</p>";
                    return;
                }

                listDiv.innerHTML = "";
                leaves.forEach(l => {
                    const statusClass = l.status === 'APPROVED' ? 'approved' : (l.status === 'REJECTED' ? 'rejected' : '');
                    const badgeColor = l.status === 'APPROVED' ? '#2ecc71' : (l.status === 'REJECTED' ? '#e74c3c' : '#f39c12');
                    
                    const div = document.createElement('div');
                    div.className = `leave-item ${statusClass}`;
                    div.innerHTML = `
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <strong>${l.leaveType}</strong>
                            <span style="font-size: 11px; font-weight: bold; color: ${badgeColor};">${l.status}</span>
                        </div>
                        <p><strong>Duration:</strong> ${l.fromDate} to ${l.toDate} (${l.totalDays} Days)</p>
                        <p><strong>Reason:</strong> ${l.reason}</p>
                    `;
                    listDiv.appendChild(div);
                });
            } catch (error) {
                listDiv.innerHTML = "<p style='color: red;'>Failed to load history.</p>";
            }
        }
